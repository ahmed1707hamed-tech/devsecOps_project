apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsecops-backend
  namespace: devsecops
  labels:
    app: devsecops-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devsecops-backend
  template:
    metadata:
      labels:
        app: devsecops-backend
    spec:
      containers:
        - name: backend
          image: ahmed7amed9/devsecops-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "postgresql://postgres:postgres@postgres:5432/taskdb"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
